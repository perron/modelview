[package]
name = "modelview"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Desktop 3D model viewer for FBX, glTF, OBJ, STL, and PLY, with a CLI and MCP server"
readme = "README.md"
authors = ["Karl Perron"]
rust-version = "1.88"
publish = false

[dependencies]
ufbx = "=0.11.5"
gltf = { version = "1.4", features = ["extensions"] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tga", "bmp", "gif"] }
image_dds = { version = "0.7", default-features = false, features = ["ddsfile", "image"] }
wgpu = "30"
pollster = "0.4"
glam = "0.34"
bytemuck = { version = "1", features = ["derive"] }
rfd = "0.18"
rmcp = { version = "3.10", default-features = true, features = ["transport-io"] }
schemars = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "time"] }
sha2 = "0.10"
libc = "0.2"
base64 = "0.22"
draco-core = { version = "2.3.3", default-features = false, features = ["decoder", "encoder"] }

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "wgpu", "x11"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "wgpu"] }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
serde_json = "1"
